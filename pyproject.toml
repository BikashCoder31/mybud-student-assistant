[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "staticfiles"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project]
name = "mybud-student-assistant"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.18",
    "google-genai==1.75.0",
    "Pillow==12.3.0",
    "python-dotenv==1.2.4",
    "whitenoise==6.12.0",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.vercel]
entrypoint = "project.wsgi:application"
